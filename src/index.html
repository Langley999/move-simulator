<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="index.css">
</head>
<body>
<div id="game-container">
  <div id="scoreboard">
    <h2>Level: <span id="level">1</span></h2>
    <h2>Score: <span id="score">0</span></h2>
    <div id="timer-container">
      <h3>Time Left: <span id="timer">60</span>s</h3>
    </div>
    <div id="food-legend">
      <h3>Food Types:</h3>
      <div class="legend-item"><span class="food-sample">🍎</span> Apple (1 pt, slow)</div>
      <div class="legend-item"><span class="food-sample">🍌</span> Banana (2 pts, medium-slow)</div>
      <div class="legend-item"><span class="food-sample">🍊</span> Orange (3 pts, medium)</div>
      <div class="legend-item"><span class="food-sample">🍇</span> Grape (4 pts, medium-fast)</div>
      <div class="legend-item"><span class="food-sample">🍒</span> Cherry (5 pts, fast)</div>
    </div>
  </div>
  <div id="spelplan">
    <div id="pane" />
  </div>
</div>
<script src="index.js"></script>
<div class="note">
  Please use the arrow keys to move the robot around the board and catch the moving food!
</div>
</body>
</html>
